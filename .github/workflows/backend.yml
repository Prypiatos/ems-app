name: Backend CI/CD - Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VERSION=${{ github.sha }} \
            -t ${{ secrets.DOCKER_USERNAME }}/backend:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/backend:${{ github.sha }} \
            ./backend

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/backend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/backend:${{ github.sha }}

      - name: Update K8s repo (GitOps sync)
        run: |
          curl -s https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
          sudo mv kustomize /usr/local/bin/
        
          git clone https://${{ secrets.GH_TOKEN }}@github.com/Prypiatos/ems-app.git
          cd ems-app
        
          git checkout main
        
          kustomize edit set image sheharakarunarathna/backend=sheharakarunarathna/backend:${{ github.sha }}
        
          git config user.name "github-actions"
          git config user.email "actions@github.com"
        
          git add .
          git diff --cached --quiet || git commit -m "Update backend image to ${{ github.sha }}"
          git push
