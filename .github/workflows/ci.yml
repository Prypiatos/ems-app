name: Backend CI

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26.1'
          cache: true
          cache-dependency-path: backend/go.sum
      
      - name: Run tests with race detector
        working-directory: backend
        run: go test -race ./...
        continue-on-error: true

      - name: Start Kafka broker
        run: docker compose up -d broker

      - name: Wait for Kafka broker
        run: |
          for i in {1..20}; do
            if docker compose exec -T broker /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1; then
              exit 0
            fi
            sleep 3
          done
          echo "Kafka broker not ready"
          docker compose logs broker
          exit 1

      - name: Run integration tests
        working-directory: backend
        env:
          KAFKA_BROKER: localhost:9092
        run: go test -tags=integration ./internal/integration/...

  lint:
    name: Run Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26.1'
          cache: true
          cache-dependency-path: backend/go.sum
      
      - name: Run go vet
        working-directory: backend
        run: go vet ./...
        continue-on-error: true

  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26.1'
      
      - name: Check code formatting
        working-directory: backend
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files need formatting:"
            echo "$unformatted"
            exit 1
          fi
        continue-on-error: true
