name: Backend CI

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26.1'
          cache: true
          cache-dependency-path: backend/go.sum
      
      - name: Run tests with race detector
        working-directory: backend
        run: go test -race ./...
        continue-on-error: true

  lint:
    name: Run Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26.1'
          cache: true
          cache-dependency-path: backend/go.sum
      
      - name: Run go vet
        working-directory: backend
        run: go vet ./...
        continue-on-error: true

  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26.1'
      
      - name: Check code formatting
        working-directory: backend
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files need formatting:"
            echo "$unformatted"
            exit 1
          fi
        continue-on-error: true
