apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-declarative-config
data:
  kong.yml: |
    _format_version: "3.0"
    _transform: true

    services:
      - name: ems-backend
        url: http://ems-backend:8080
        routes:
          - name: ems-api
            paths:
              - /
            strip_path: false

    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - PATCH
            - OPTIONS
          headers:
            - Accept
            - Accept-Version
            - Content-Length
            - Content-MD5
            - Content-Type
            - Date
            - Authorization
          exposed_headers:
            - X-Auth-Token
          credentials: true
          max_age: 3600

      - name: rate-limiting
        config:
          second: 100
          hour: 10000
          policy: local

      - name: prometheus
        config: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ems-kong
  labels:
    app: ems-kong
spec:
  selector:
    app: ems-kong
  type: ClusterIP
  ports:
    - name: proxy-http
      port: 8000
      targetPort: 8000
      protocol: TCP
    - name: admin-http
      port: 8001
      targetPort: 8001
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ems-kong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ems-kong
  template:
    metadata:
      labels:
        app: ems-kong
    spec:
      containers:
        - name: ems-kong
          image: sheharakarunarathna/kong:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
            - containerPort: 8001
            - containerPort: 8443
            - containerPort: 8444
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /usr/local/kong/declarative/kong.yml
            - name: KONG_PROXY_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_ADMIN_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_PROXY_ERROR_LOG
              value: /dev/stderr
            - name: KONG_ADMIN_ERROR_LOG
              value: /dev/stderr
            - name: KONG_ADMIN_LISTEN
              value: 0.0.0.0:8001, 0.0.0.0:8444 ssl
          volumeMounts:
            - name: kong-config
              mountPath: /usr/local/kong/declarative/kong.yml
              subPath: kong.yml
      volumes:
        - name: kong-config
          configMap:
            name: kong-declarative-config
