_format_version: "3.0"
_transform: true

services:
  - name: ems-backend
    url: http://ems-backend:8080
    routes:
      - name: ems-api
        paths:
          - /
        strip_path: false
        # JWT validation is handled by the Go backend middleware
        # Kong acts as reverse proxy + rate limiter + CORS

plugins:
  - name: cors
    config:
      origins:
        - "http://localhost:3000"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
      exposed_headers:
        - X-Auth-Token
        - X-Request-ID
        - Authorization
      credentials: true
      max_age: 3600

  - name: rate-limiting
    config:
      second: 100
      hour: 10000
      policy: local

  - name: prometheus
    config: {}
