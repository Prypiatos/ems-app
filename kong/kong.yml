_format_version: "3.0"
_transform: true

services:
  - name: ems-backend-ws
    url: http://ems-backend:8080/api/v1/readings
    routes:
      - name: ems-ws
        paths:
          - /api/readings
        strip_path: true
        # No auth here — browser WebSocket connections
        # Auth is handled by the backend via token in query param

  - name: ems-backend
    url: http://ems-backend:8080
    routes:
      - name: ems-api
        paths:
          - /api
        strip_path: true
        # JWT validation is handled by the Go backend middleware
        # Kong acts as reverse proxy + rate limiter + CORS

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
      exposed_headers:
        - X-Auth-Token
      credentials: true
      max_age: 3600

  - name: rate-limiting
    config:
      second: 5
      hour: 10000
      policy: local

  - name: prometheus
    config: {}
