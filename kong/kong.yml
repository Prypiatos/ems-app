_format_version: "3.0"
_transform: true

services:
  - name: ems-backend
    url: http://ems-backend:8080
    routes:
      - name: ems-api
        paths:
          - /
        strip_path: false
        # JWT validation is handled by the Go backend middleware
        # Kong acts as reverse proxy + rate limiter + CORS

  - name: go-backend
    url: http://ems-backend:8080
    routes:
      - name: go-api
        paths:
          - /go
        strip_path: true

  - name: py-backend
    url: http://192.168.51.139:8000
    routes:
      - name: py-api
        paths:
          - /py
        strip_path: true

  - name: keycloak
    url: http://keycloak:8180
    routes:
      - name: keycloak-api
        paths:
          - /keycloak
        strip_path: true

plugins:
  - name: cors
    config:
      origins:
        - "http://localhost:3000"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
      exposed_headers:
        - X-Auth-Token
        - X-Request-ID
        - Authorization
      credentials: true
      max_age: 3600

  - name: rate-limiting
    config:
      second: 100
      hour: 10000
      policy: local

  - name: prometheus
    config: {}
